set -g mouse on
setw -g mode-keys vi

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Double click to select and copy word
bind-key -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"

# Status bar customization
set -g status-style bg=colour246,fg=black
set -g status-right "%Y-%b-%d %I:%M %p"

# Vim-style visual selection in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Scroll back farther
set -g history-limit 50000
